name: Rust CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test community learning security and stale-data gates
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test native Rust backend
        run: RUSTFLAGS="-D warnings" cargo test --workspace
      - name: Verify native community regex auditor
        run: RUSTFLAGS="-D warnings" cargo test -p matchlab-parser --example audit_community_regex
      - name: Check all Rust targets, including parser benchmarks
        run: RUSTFLAGS="-D warnings" cargo check --workspace --all-targets
      - name: Build lightweight production Docker image with native Rust ML
        run: docker build -t matchlab:test .
      - name: Verify native online training and prediction
        run: docker run --rm --entrypoint /usr/local/bin/matchlab-server matchlab:test verify-native-ml
      - name: Smoke benchmark native model and canonical parser on AMD64
        run: docker run --rm --entrypoint /usr/local/bin/matchlab-server matchlab:test benchmark-native-ml

  arm64-native-ml:
    # Native ARM64 build and train/predict self-test for Oracle A1 hosts.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build official ARM64 image with native Rust learner
        run: docker build --platform linux/arm64 -t matchlab:arm64-test .
      - name: Verify ARM64 online learner and prediction
        run: docker run --rm --entrypoint /usr/local/bin/matchlab-server matchlab:arm64-test verify-native-ml
      - name: Smoke benchmark native model and parser on ARM64
        run: docker run --rm --entrypoint /usr/local/bin/matchlab-server matchlab:arm64-test benchmark-native-ml
