name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest -q tests/test_media_match.py tests/test_v4_matching.py tests/test_country_anime_matching.py tests/test_anime_only.py tests/test_dashboard.py
          python -m pytest -q -s tests/test_100_titles.py
      - name: Build Docker image
        run: docker build -t torrent-parse-match:test .
