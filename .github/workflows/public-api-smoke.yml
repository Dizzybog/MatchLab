name: Public API 150-title smoke test
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public MatchLab API base URL
        required: true
        default: https://matchlab.notprod.fyi
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run 50 movie, 50 series and 50 anime requests
        run: python3 scripts/test_public_api.py --url "${{ inputs.api_url }}" --out matchlab-api-report.json
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-public-api-150-title-report
          path: matchlab-api-report.json
          if-no-files-found: warn
