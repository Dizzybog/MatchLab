name: Community learning review

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"

# Trusted default branch only; untrusted issue text is data, never code.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: matchlab-community-learning-daily
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Test intake and historical-version validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Recover today's and historical community issue comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/community_issue_intake.py \
            --out "$RUNNER_TEMP/community-comments.json"
      - name: Restore durable dedup ledger (including empty or missing first asset)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/community_state.py load ledger --path "$RUNNER_TEMP/fingerprints.txt"
      - name: Build latest Rust parser for safe replay
        run: cargo build --release -p matchlab-parser --example community_replay
      - name: Replay historical reports, dedup globally, train verified-only shadow model
        env:
          LATEST_SHA: ${{ github.sha }}
        run: |
          python3 scripts/community_learning.py \
            --comments "$RUNNER_TEMP/community-comments.json" \
            --verified learning/verified.jsonl \
            --sha "$LATEST_SHA" \
            --parser-bin target/release/examples/community_replay \
            --seen "$RUNNER_TEMP/fingerprints.txt" \
            --seen-output "$RUNNER_TEMP/fingerprints-updated.txt" \
            --review-output "$RUNNER_TEMP/community-review.jsonl" \
            --model-output "$RUNNER_TEMP/community-shadow-model.json"
      - name: Validate opt-in rule proposals (schema and source ancestry)
        env:
          LATEST_SHA: ${{ github.sha }}
        run: |
          python3 scripts/community_rule_intake.py \
            --comments "$RUNNER_TEMP/community-comments.json" \
            --seen "$RUNNER_TEMP/fingerprints-updated.txt" \
            --sha "$LATEST_SHA" \
            --out "$RUNNER_TEMP/community-rule-candidates.json" \
            --seen-out "$RUNNER_TEMP/fingerprints-final.txt"
      - name: Restore latest verified community backlog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/community_state.py load backlog --path "$RUNNER_TEMP/backlog.json"
      - name: Merge yesterday's proposals with unprocessed historical backlog
        run: |
          python3 scripts/community_backlog.py prepare \
            --state "$RUNNER_TEMP/backlog.json" \
            --candidate-file "$RUNNER_TEMP/community-rule-candidates.json" \
            --seen "$RUNNER_TEMP/fingerprints-final.txt" \
            --curated learning/community_rules.json \
            --extended learning/community_regex_proposals.json \
            --out "$RUNNER_TEMP/backlog-prepared.json" \
            --daily "$RUNNER_TEMP/community-daily-review.json"
      - name: Persist backlog BEFORE screening; retain last verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/backlog-prepared.json" "$RUNNER_TEMP/backlog.json"
          python3 scripts/community_state.py save backlog \
            --path "$RUNNER_TEMP/backlog.json" --phase prepared
      - name: Screen at most one rule against latest trusted Rust parser
        run: |
          cp learning/community_rules.json "$RUNNER_TEMP/community-rules-before.json"
          cp learning/community_regex_proposals.json "$RUNNER_TEMP/community-extended-before.json"
          cargo run --release --locked -p matchlab-parser \
            --example screen_community_rules -- \
            "$RUNNER_TEMP/community-daily-review.json" \
            learning/community_rules.json \
            "$RUNNER_TEMP/curated-rules-next.json"
          cp "$RUNNER_TEMP/curated-rules-next.json" learning/community_rules.json
          # Select only actual release names associated with each validated
          # rule in the same Issue batch. These are untrusted test inputs:
          # they are NOT proof of a correct IMDb/anime mapping.
          python3 scripts/community_evidence.py \
            --comments "$RUNNER_TEMP/community-comments.json" \
            --candidates "$RUNNER_TEMP/community-daily-review.json" \
            --sha "${GITHUB_SHA}" \
            --out "$RUNNER_TEMP/community-title-cases.json"
          # Reconstruct only safe source-handler changes in Rust, compare
          # before/after on real community titles and protected fixtures.
          cargo run --release --locked -p matchlab-parser \
            --example audit_community_regex -- \
            "$RUNNER_TEMP/community-daily-review.json" \
            learning/regex_review_fixtures.json \
            "$RUNNER_TEMP/community-regex-impact.json" \
            "$RUNNER_TEMP/community-title-cases.json"
          # Source-aware field and TV proposals are reviewed as DATA first.
          # Never execute an Issue-supplied regex or update handlers.json
          # without independent verification by a maintainer.
          python3 scripts/review_community_regex.py \
            "$RUNNER_TEMP/community-daily-review.json" \
            learning/community_regex_proposals.json \
            "$RUNNER_TEMP/community-regex-next.json" \
            "$RUNNER_TEMP/community-regex-impact.json"
          cp "$RUNNER_TEMP/community-regex-next.json" learning/community_regex_proposals.json
          # Two independent positive fixtures plus zero protected regressions
          # can stage an exact source-handler merge for HUMAN approval.
          python3 scripts/community_apply_verified_regex.py \
            --before "$RUNNER_TEMP/community-extended-before.json" \
            --after learning/community_regex_proposals.json \
            --audit "$RUNNER_TEMP/community-regex-impact.json" \
            --fixtures learning/regex_review_fixtures.json \
            --handlers crates/matchlab-parser/src/generated/handlers.json \
            --promoted learning/regex_promoted_tests.json \
            --summary "$RUNNER_TEMP/community-promotion-summary.json"
          # The reviewer sometimes normalizes an empty array from "[\\n]" to
          # "[]". A whitespace-only diff must NEVER create a no-op PR or
          # consume a community fingerprint from the durable backlog.
          python3 scripts/community_review_diff.py \
            "$RUNNER_TEMP/community-rules-before.json" \
            learning/community_rules.json \
            "$RUNNER_TEMP/community-extended-before.json" \
            learning/community_regex_proposals.json \
            "$GITHUB_ENV"
      - name: Test candidate against full Rust regression suite
        if: env.COMMUNITY_RULE_CHANGED == 'true'
        run: |
          RUSTFLAGS="-D warnings" cargo test --workspace --locked
          RUSTFLAGS="-D warnings" cargo check --workspace --all-targets --locked
      - name: Open at most one human-review regex PR per daily run
        if: env.COMMUNITY_RULE_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="bot/community-regex-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          # A prior review PR may still be pending human approval. Do not
          # create a second PR for the same unmerged fingerprint on a later day.
          # The durable backlog keeps other candidates until review completes.
          if gh pr list --repo "$GH_REPO" --state open \
            --json headRefName --jq '.[] | .headRefName' | grep -q '^bot/community-regex-'; then
            echo "A community rule review PR is already awaiting human review"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add learning/community_rules.json learning/community_regex_proposals.json \
            learning/regex_promoted_tests.json crates/matchlab-parser/src/generated/handlers.json
          git commit -m "feat(parser): propose a verified community regex rule"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/community-pr-body.md" <<'EOF'
          <!-- matchlab-community-regex-review-v1 -->
          ## Automatically proposed regex rule — human review required

          This PR was generated by the trusted Community Learning GitHub Action
          from an opt-in local learning proposal. All Issue examples are
          **untrusted**. The trusted Rust auditor compares source regex with
          the native handler, replays complete parser results on protected
          titles and independent maintainer-labeled fixtures, and reports
          redundant, conflicting and useful changes. Full Rust CI must pass.

          **Do not merge without independently confirming representative IMDb
          and AniDB/TVDB mappings.** The originating user supplied those mapping
          claims; a GitHub issue is not source attestation.

          A merge includes the safe rule in the next MatchLab image, with
          crosswalk verification on matching. The parser and matcher remain
          fully functional without any ML opt-in or GitHub connection.

          Regex additions and proposed changes to existing handlers use
          strict trusted grammars and carry the exact original/new regex.
          An exact native-handler regex union may also be staged as a code
          diff, but ONLY after two independently labeled fixtures improve
          with zero protected regressions. Those fixtures become native
          regression tests. Other technical/TV suggestions remain REVIEW
          DATA ONLY. Nothing in Issue comments can certify matching IDs.

          This Action NEVER merges its own PR into main; source diffs require
          maintainer approval.
          EOF
          # The report contains counters and fingerprints only.
          python3 - "$RUNNER_TEMP/community-regex-impact.json" \
            "$RUNNER_TEMP/community-promotion-summary.json" \
            >> "$RUNNER_TEMP/community-pr-body.md" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf8") as fh:
              audits=json.load(fh)
          with open(sys.argv[2],encoding="utf8") as fh:
              promotion=json.load(fh)
          print("\n### Native Rust regex audit")
          for row in audits:
              fingerprint=str(row.get("fingerprint",""))[:12]
              kind=str(row.get("kind","unknown"))
              status=str(row.get("status","unknown"))
              gains=int(row.get("verified_improvements",0))
              synthetic=int(row.get("synthetic_changes",0))
              regressions=int(row.get("regressions",0))
              print(f"- {fingerprint} ({kind}): {status}; "
                    f"verified gains={gains}, synthetic changes={synthetic}, "
                    f"regressions={regressions}")
          if promotion:
              print("\nSource merge proposal: handler "
                    f"{int(promotion['handler_index'])}; "
                    "trusted fixtures promoted to Rust regression tests.")
          PY
          gh pr create --repo "$GH_REPO" \
            --base main --head "$branch" \
            --title "feat(parser): review high-evidence community regex" \
            --body-file "$RUNNER_TEMP/community-pr-body.md"
          echo "COMMUNITY_PR_CREATED=true" >> "$GITHUB_ENV"
      - name: Dedup only rules actually placed into a review PR
        if: env.COMMUNITY_PR_CREATED == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((temp / "community-rules-before.json").read_text())
          after = json.loads(Path("learning/community_rules.json").read_text())
          old_markers = {r["marker"] for r in before}
          before_extended = json.loads((temp / "community-extended-before.json").read_text())
          after_extended = json.loads(Path("learning/community_regex_proposals.json").read_text())
          old_extended = {r["fingerprint"] for r in before_extended}
          ledger = temp / "fingerprints-final.txt"
          seen = set(ledger.read_text().splitlines())
          for rule in after:
              if rule["marker"] not in old_markers:
                  seen.add(hashlib.sha256(("community-regex:" + rule["marker"]).encode()).hexdigest())
          for proposal in after_extended:
              if proposal["fingerprint"] not in old_extended:
                  seen.add(proposal["fingerprint"])
          ledger.write_text("\n".join(sorted(seen)) + ("\n" if seen else ""))
          PY
      - name: Finalize acknowledged review backlog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          accepted=[]
          if os.environ.get("COMMUNITY_PR_CREATED")=="true":
              before=json.loads((temp/"community-rules-before.json").read_text())
              after=json.loads(Path("learning/community_rules.json").read_text())
              old={row["marker"] for row in before}
              for row in after:
                  if row["marker"] not in old:
                      accepted.append(hashlib.sha256(("community-regex:"+row["marker"]).encode()).hexdigest())
              before=json.loads((temp/"community-extended-before.json").read_text())
              after=json.loads(Path("learning/community_regex_proposals.json").read_text())
              old={row["fingerprint"] for row in before}
              accepted.extend(row["fingerprint"] for row in after if row["fingerprint"] not in old)
          (temp/"community-backlog-accepted.json").write_text(json.dumps(accepted))
          PY
          python3 scripts/community_backlog.py finalize \
            --state "$RUNNER_TEMP/backlog-prepared.json" \
            --daily "$RUNNER_TEMP/community-daily-review.json" \
            --accepted "$RUNNER_TEMP/community-backlog-accepted.json" \
            --out "$RUNNER_TEMP/backlog-next.json"
          cp "$RUNNER_TEMP/backlog-next.json" "$RUNNER_TEMP/backlog.json"
          python3 scripts/community_state.py save backlog \
            --path "$RUNNER_TEMP/backlog.json" --phase final
      - name: Persist dedup ledger as a verified nonempty versioned asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/fingerprints-final.txt" "$RUNNER_TEMP/fingerprints.txt"
          python3 scripts/community_state.py save ledger \
            --path "$RUNNER_TEMP/fingerprints.txt" --phase ledger
      - name: Publish bounded review artifact; no automatic model activation
        uses: actions/upload-artifact@v4
        with:
          name: community-learning-review
          path: |
            ${{ runner.temp }}/community-review.jsonl
            ${{ runner.temp }}/community-shadow-model.json
            ${{ runner.temp }}/community-regex-impact.json
            ${{ runner.temp }}/community-promotion-summary.json
          retention-days: 7
          if-no-files-found: error
      # Only after the backlog, dedup ledger and review artifacts are durable:
      # close old bot-owned discussion threads and abandoned review PRs, then
      # prune eligible bot/community-regex branches after a recovery window.
      # This cleanup never touches ordinary parser issues, PRs or branches.
      - name: Archive stale Community Learning issues and parser-review branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/community_cleanup.py --apply
