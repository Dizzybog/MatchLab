services:
  matchlab:
    image: ghcr.io/dizzybog/matchlab:latest
    pull_policy: always
    container_name: matchlab
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 6g
    pids_limit: 256
    environment:
      RUST_LOG: matchlab_server=info
      MATCHLAB_MAX_CONCURRENT_MATCHES: "40"
      MATCHLAB_DB: /data/metadata.sqlite3
      MATCHLAB_HOST: 0.0.0.0:8765
      # Optional overrides; public sources and seven-day refresh are built in.
      # MATCHLAB_METADATA_URLS: https://...,...
      # MATCHLAB_METADATA_REFRESH_HOURS: "168"
      # Optional local learning only (no uploads, no ONNX dependency in base image):
      # MATCHLAB_ML_ENABLED: "true"
      # MATCHLAB_ML_MODEL_PATH: /data/learning-model.onnx
      # For ONNX scoring build the image with --build-arg MATCHLAB_FEATURES=ml-ort
      # and mount a compatible ONNX Runtime shared library (ORT_DYLIB_PATH).
      # MATCHLAB_ML_STATE_FILE: /data/local-learning.sqlite3
      # Community Learning needs explicit opt-in and a personal GitHub Issues token.
      # MATCHLAB_COMMUNITY_LEARNING_ENABLED: "true"
      # MATCHLAB_COMMUNITY_GITHUB_TOKEN: ${MATCHLAB_COMMUNITY_GITHUB_TOKEN}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - metadata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  metadata:
