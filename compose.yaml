services:
  matchlab:
    image: ghcr.io/dizzybog/matchlab:latest
    pull_policy: always
    container_name: matchlab
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 6g
    pids_limit: 256
    environment:
      RUST_LOG: matchlab_server=info
      MATCHLAB_MAX_CONCURRENT_MATCHES: "40"
      MATCHLAB_DB: /data/metadata.sqlite3
      MATCHLAB_HOST: 0.0.0.0:8765
      # Optional overrides; public sources and seven-day refresh are built in.
      # MATCHLAB_METADATA_URLS: https://...,...
      # MATCHLAB_METADATA_REFRESH_HOURS: "168"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - metadata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  metadata:
