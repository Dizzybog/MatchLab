services:
  torrent-parse-match:
    image: ghcr.io/dizzybog/torrent-parse-match:latest
    pull_policy: always
    init: false
    environment:
      LOG_LEVEL: DEBUG
    container_name: torrent-parse-match
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - metadata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  metadata:
