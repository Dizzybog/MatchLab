services:
  matchlab:
    image: ghcr.io/dizzybog/matchlab:latest
    pull_policy: always
    container_name: matchlab
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 6g
    pids_limit: 256
    environment:
      RUST_LOG: matchlab_server=info
      MATCHLAB_DB: /data/metadata.sqlite3
      MATCHLAB_HOST: 0.0.0.0:8765
      MATCHLAB_MAX_CONCURRENT_MATCHES: "40"
      # Local CPU-only Rust machine learning. False = standard MatchLab.
      MATCHLAB_ML_ENABLED: "${MATCHLAB_ML_ENABLED:-false}"
      # Number of distinct validated training observations to retain.
      MATCHLAB_ML_TRAINING_MAX_EXAMPLES: "${MATCHLAB_ML_TRAINING_MAX_EXAMPLES:-500000}"
      # Training evidence quota (cache has a separate SQLite database/budget).
      MATCHLAB_ML_MAX_STORAGE_GB: "${MATCHLAB_ML_MAX_STORAGE_GB:-10}"
      MATCHLAB_ML_QUEUE_MAX_ITEMS: "${MATCHLAB_ML_QUEUE_MAX_ITEMS:-20000}"
      MATCHLAB_ML_TRAINING_BATCH_SIZE: "${MATCHLAB_ML_TRAINING_BATCH_SIZE:-64}"
      MATCHLAB_ML_CACHE_MAX_STORAGE_GB: "${MATCHLAB_ML_CACHE_MAX_STORAGE_GB:-1}"
      # Versioned result cache; stale answers are parsed and matched again.
      MATCHLAB_ML_CACHE_ENABLED: "${MATCHLAB_ML_CACHE_ENABLED:-true}"
      MATCHLAB_ML_CACHE_MAX_ENTRIES: "${MATCHLAB_ML_CACHE_MAX_ENTRIES:-200000}"
      # Optional: configure TTL or community GitHub reporting in a local
      # compose.override.yaml; local learning does not need GitHub access.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - metadata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  metadata:
