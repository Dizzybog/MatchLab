services:
  matchlab:
    image: ghcr.io/dizzybog/matchlab:latest
    pull_policy: always
    container_name: matchlab
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 6g
    pids_limit: 256
    environment:
      RUST_LOG: matchlab_server=info
      MATCHLAB_DB: /data/metadata.sqlite3
      MATCHLAB_HOST: 0.0.0.0:8765
      MATCHLAB_MAX_CONCURRENT_MATCHES: "40"
      # true: only full normalized IMDb/AniDB title aliases; no prefix,
      # suffix, internal alias, longer-source recovery or partial fallback.
      # Set MATCHLAB_STRICT_MODE=true to opt in (default: false).
      MATCHLAB_STRICT_MODE: "${MATCHLAB_STRICT_MODE:-false}"
      # Total ML disk budget in GiB. 0=off, positive=on; one setting
      # automatically sizes training evidence, SQLite result cache and queue.
      MATCHLAB_ML_SIZE_GB: "${MATCHLAB_ML_SIZE_GB:-0}"
      # Advanced opt-outs and community sharing are intentionally omitted.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - metadata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  metadata:
