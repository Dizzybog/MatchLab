[workspace]
members = [
  "crates/ptt-core",
  "crates/matchlab-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Dizzybog"]
description = "A high-performance Rust implementation of The Best Damn Filename Parser You've Ever Used!"
homepage = "https://github.com/Dizzybog/torrent-parse-match"
repository = "https://github.com/Dizzybog/torrent-parse-match"

[workspace.dependencies]
aho-corasick = "1.1.4"
chrono = { version = "0.4.44", features = ["clock"] }
criterion = "0.8.2"
fancy-regex = "0.17.0"
indexmap = "2.13.0"
once_cell = "1.21.4"
pcre2 = "0.2.11"
regex-syntax = "0.8.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
thiserror = "2.0.18"
unicode-normalization = "0.1.25"
