[build-system]
requires = ["maturin>=1.12.6"]
build-backend = "maturin"

[project]
name = "torrent-parse-match"
version = "0.1.0"
authors = [{ name = "Dizzybog" }]
description = "A high-performance Rust implementation of The Best Damn Filename Parser You've Ever Used!"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "orjson>=3.11.7",
    "pydantic>=2.12.5",
    "regex>=2026.2.28",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
media-match = "MediaMatch.cli:main"

[project.urls]
Homepage = "https://github.com/Dizzybog/torrent-parse-match"
Issues = "https://github.com/Dizzybog/torrent-parse-match/issues"

[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.maturin]
manifest-path = "python/torrent_match_native/Cargo.toml"
python-source = "python"
python-packages = ["torrent_match_native", "PTT", "MediaMatch"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "LICENSE", format = "wheel" },
    { path = "python/MediaMatch/data/anime-list.override.xml", format = "wheel" },
]
exclude = [
    { path = "python/torrent_match_native/.gitignore", format = "wheel" },
    { path = "python/torrent_match_native/Cargo.toml", format = "wheel" },
    { path = "python/torrent_match_native/src/**", format = "wheel" },
]
module-name = "torrent_match_native._native"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    ".upstream-tests-cache",
    "target",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
