[package]
name = "matchlab-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ml-ort = ["dep:ort"]

[dependencies]
matchlab-parser = { path = "../matchlab-parser" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
tantivy = "0.22"
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

csv = "1.3"
flate2 = "1.1"
quick-xml = "0.38"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

sha2 = "0.10"
chrono.workspace = true

# Optional CPU-only ONNX inference. Built only with `--features ml-ort`.
# `load-dynamic` avoids a mandatory ONNX Runtime library for ordinary builds.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
